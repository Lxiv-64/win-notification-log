[package]
name = "win-notification-log-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Native (Rust) notification log for Windows: collector, journal and viewer"
license = "MIT"
publish = false

# Graphical build: the application the user starts (double click / shortcut).
[[bin]]
name = "wnl"
path = "src/bin/wnl.rs"

# Console build: diagnostics and scripting on the same journal.
[[bin]]
name = "wnl-cli"
path = "src/bin/wnl-cli.rs"

# Deliberately minimal dependency set: everything is pure Rust, so the build
# needs no C toolchain at all (SQLite comes from the in-box winsqlite3.dll and
# the user interface is built directly on Win32, see src/win32.rs).
[dependencies]
quick-xml = "0.36"
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"

# Small binaries and a fast start-up matter for a background collector.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
